name: krishimitra_ai
description: "AI-powered farming companion app for Indian farmers. Track crops, detect diseases, receive personalized recommendations, manage soil & water, stay updated with weather alerts."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ======================== STATE MANAGEMENT ========================
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.5
  url_launcher: ^6.3.1

  # ======================== DEPENDENCY INJECTION ========================
  get_it: ^9.2.0
  injectable: ^2.4.2

  # ======================== FIREBASE ========================
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  firebase_messaging: ^16.1.0
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.0.6

  # ======================== LOCAL STORAGE ========================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  # ======================== NETWORKING ========================
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^7.0.0
  # internet_connection_checker removed - use connectivity_plus instead

  # ======================== LOCALIZATION ========================
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # ======================== CAMERA & IMAGE PROCESSING ========================
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  # TensorFlow Lite - Using compatible versions
  tflite_flutter: ^0.12.1
  # tflite_flutter_helper removed - causes conflicts

  # ======================== AUDIO & VOICE ========================
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # ======================== NOTIFICATIONS ========================
  flutter_local_notifications: ^20.0.0
  package_info_plus: ^9.0.0
  # ======================== UI & DESIGN ========================
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  fl_chart: ^1.1.1
  percent_indicator: ^4.2.3
  lottie: ^3.1.2

  # ======================== PERMISSIONS ========================
  permission_handler: ^12.0.1

  # ======================== LOCATION ========================
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # ======================== UTILITIES ========================
  logger: ^2.4.0
  uuid: ^4.5.1
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ======================== DATE & TIME ========================
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ======================== LINTING ========================
  flutter_lints: ^6.0.0

  # ======================== CODE GENERATION ========================
  build_runner: ^2.4.12
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

  # ======================== TESTING ========================
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

# ======================== APP ICON & SPLASH GENERATOR ========================
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  # ======================== ASSETS ========================
  assets:
    - assets/icon/
    - assets/splash/

# ==================== APP ICON CONFIGURATION ====================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  
  # Android adaptive icon (Material You support)
  #adaptive_icon_background: "#6BA368"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
  
  # Remove default Flutter icons
  remove_alpha_ios: true

# ==================== SPLASH SCREEN CONFIGURATION ====================
flutter_native_splash:
  color: "#F8F9FA"
  image: assets/icon/app_icon.jpg
  
  android_12:
    image: assets/icon/app_icon.jpg
    color: "#F8F9FA"
    #icon_background_color: "#6BA368"
  
  fullscreen: true
  android: true
  ios: true